# Conda environment matching the one the results were produced in.
#
#   conda env create -f environment.yml
#   conda activate pt_sim
#
# Reproducing the figures needs only numpy, pandas, matplotlib and scipy; the
# rest is for re-running the simulation pipeline. See README.
name: pt_sim
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13.5

  # Required to reproduce the figures
  - numpy=2.1.3
  - pandas=2.2.3
  - matplotlib=3.10.0
  - scipy=1.15.3          # the 1D true densities are evaluated at figure time

  # Required to re-run the simulation pipeline
  - scikit-learn=1.6.1
  - joblib=1.4.2
  - numba=0.61.0
  - seaborn=0.13.2
  - statsmodels=0.14.4
  - tabulate=0.9.0

  # Required only for the flow-cytometry figure (data not distributed)
  - pip
  - pip:
      - pyreadr==0.5.6
